<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مرحبا بييك معانا ف 2026</title>

  <!-- وسوم Open Graph باش تبان المعاينة مقادة فاش تبارطاجي الرابط فواتساب -->
  <meta property="og:title" content="مرحبا بييك معانا ف 2026" />
  <meta property="og:description" content="بارطاجي الليان مع صاحبك الكرينج 😂" />
  roper
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="theme-color" content="#0f172a" />

  <!-- استدعاء Tailwind CSS للتصميم العصري والمتجاوب -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- خط عربي واضح وأنيق (Cairo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Cairo', sans-serif;
    }

    /* حركة ناعمة للإضاءة في الخلفية */
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.08) translate(10px, -12px); opacity: 0.5; }
    }

    .glow-orb {
      animation: pulseGlow 7s ease-in-out infinite;
    }

    /* بطاقة زجاجية أنيقة */
    .glass-box {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.65);
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-900 text-white flex items-center justify-center p-4 sm:p-6 relative overflow-hidden select-none">

  <!-- مؤثرات ضوئية في الخلفية -->
  <div class="glow-orb absolute -top-24 -right-24 w-72 h-72 sm:w-96 sm:h-96 bg-fuchsia-600/30 rounded-full blur-3xl pointer-events-none"></div>
  <div class="glow-orb absolute -bottom-24 -left-24 w-72 h-72 sm:w-96 sm:h-96 bg-emerald-500/25 rounded-full blur-3xl pointer-events-none" style="animation-delay: 2.5s;"></div>

  <!-- البطاقة الرئيسية في وسط الشاشة -->
  <main class="glass-box relative z-10 w-full max-w-lg rounded-3xl p-8 sm:p-12 text-center transition-all duration-300">
    
    <!-- شارة السنة -->
    <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/10 border border-white/15 text-amber-300 text-sm sm:text-base font-extrabold mb-6">
      <span>🔥</span>
      <span>2026</span>
      <span>🔥</span>
    </div>

    <!-- النص المطلوب -->
    <h1 class="text-2xl sm:text-4xl font-black leading-relaxed sm:leading-snug text-white mb-8">
      مرحبا بييك معانا ف 2026
      <span class="block mt-3 text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-emerald-300 to-cyan-300">
        بارطاجي الليان مع صاحبك الكرينج
      </span>
    </h1>

    <!-- أزرار المشاركة السريعة ونسخ الرابط -->
    <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
      <button
        id="shareWhatsappBtn"
        type="button"
        class="w-full sm:w-auto flex-1 inline-flex items-center justify-center gap-2.5 px-6 py-3.5 rounded-2xl bg-emerald-500 hover:bg-emerald-400 active:scale-95 text-slate-950 font-extrabold text-base transition-all shadow-lg shadow-emerald-500/25 cursor-pointer"
      >
        <!-- أيقونة واتساب -->
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.52 3.48A11.86 11.86 0 0012.06 0C5.5 0 .16 5.34.16 11.9c0 2.1.55 4.15 1.6 5.96L0 24l6.33-1.66a11.87 11.87 0 005.73 1.46h.01c6.56 0 11.9-5.34 11.9-11.9 0-3.18-1.24-6.17-3.45-8.42zM12.07 21.8h-.01a9.87 9.87 0 01-5.03-1.38l-.36-.21-3.76.99 1-3.66-.24-.38a9.85 9.85 0 01-1.51-5.26c0-5.45 4.44-9.89 9.9-9.89 2.64 0 5.13 1.03 7 2.9a9.83 9.83 0 012.9 7c0 5.46-4.44 9.89-9.89 9.89zm5.43-7.41c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.64.07-.3-.15-1.26-.46-2.39-1.48-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48 0 1.46 1.07 2.88 1.21 3.07.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.23 1.36.2 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35z"/>
        </svg>
        <span>بارطاجي فواتساب</span>
      </button>

      <button
        id="copyUrlBtn"
        type="button"
        class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-5 py-3.5 rounded-2xl bg-white/10 hover:bg-white/15 active:scale-95 border border-white/15 text-white font-bold text-base transition-all cursor-pointer"
      >
        <span>نسخ الليان</span>
      </button>
    </div>

    <!-- رسالة تأكيد النسخ -->
    <p id="statusToast" class="mt-4 text-sm font-bold text-emerald-300 opacity-0 transition-opacity duration-300" role="status">
      تم نسخ الليان! صيفطو لصاحبك دابا 😂✅
    </p>
  </main>

  <script>
    // منطق المشاركة المباشرة على واتساب ونسخ الرابط
    document.addEventListener('DOMContentLoaded', () => {
      const shareWhatsappBtn = document.getElementById('shareWhatsappBtn');
      const copyUrlBtn = document.getElementById('copyUrlBtn');
      const statusToast = document.getElementById('statusToast');
      let toastTimer = null;

      // دالة إظهار رسالة التنبيه المؤقتة
      function showToast(message) {
        statusToast.textContent = message;
        statusToast.classList.remove('opacity-0');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          statusToast.classList.add('opacity-0');
        }, 2800);
      }

      // فتح واتساب مع الرسالة ورابط الصفحة الحالي
      shareWhatsappBtn.addEventListener('click', () => {
        try {
          const currentUrl = window.location.href;
          const message = `مرحبا بييك معانا ف 2026 😂\n${currentUrl}`;
          const waLink = `https://wa.me/?text=${encodeURIComponent(message)}`;
          window.open(waLink, '_blank', 'noopener,noreferrer');
        } catch (error) {
          showToast('وقع خطأ أثناء فتح واتساب، جرب نسخ الليان.');
        }
      });

      // نسخ الرابط باستعمال execCommand لضمان الاشتغال داخل جميع المتصفحات والإطارات
      copyUrlBtn.addEventListener('click', () => {
        try {
          const tempInput = document.createElement('input');
          tempInput.value = window.location.href;
          document.body.appendChild(tempInput);
          tempInput.select();
          tempInput.setSelectionRange(0, 99999);
          document.execCommand('copy');
          document.body.removeChild(tempInput);
          showToast('تم نسخ الليان! صيفطو لصاحبك دابا 😂✅');
        } catch (error) {
          showToast('تعذر النسخ التلقائي، انسخ الرابط من الفوق.');
        }
      });
    });
  </script>
</body>
</html>
